```xml
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="180" viewBox="0 0 980 180" role="img" aria-label="build break rebuild better repeat">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect x="22" y="22" width="936" height="136" rx="20"/>
    </clipPath>
  </defs>

  <rect
    x="8"
    y="8"
    width="964"
    height="164"
    rx="24"
    fill="url(#bg)"
    stroke="#2f3748"
    stroke-width="1.5"
  />

  <rect
    x="18"
    y="18"
    width="944"
    height="144"
    rx="20"
    fill="none"
    stroke="#ffffff"
    stroke-opacity=".06"
  />

  <g clip-path="url(#clip)">
    <g filter="url(#glow)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; -1040 0; 1040 0; 0 0"
        keyTimes="0; .33; .66; 1"
        dur="5.5s"
        repeatCount="indefinite"
      />

      <text
        x="490"
        y="104"
        text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="36"
        font-weight="700"
        fill="#e5e7eb"
        letter-spacing="1.2"
      >
        build → break → rebuild better → repeat
      </text>
    </g>

    <rect
      x="40"
      y="132"
      width="900"
      height="2"
      rx="1"
      fill="#7c3aed"
      opacity=".35"
    >
      <animateTransform
        attributeName="transform"
        type="translate"
        values="-980 0; 980 0"
        dur="1.8s"
        repeatCount="indefinite"
      />
    </rect>

    <circle cx="62" cy="44" r="4" fill="#22c55e" opacity=".9"/>
    <circle cx="82" cy="44" r="4" fill="#eab308" opacity=".9"/>
    <circle cx="102" cy="44" r="4" fill="#ef4444" opacity=".9"/>
  </g>

</svg>
